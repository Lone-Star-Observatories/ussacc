name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test policy and journey logic
        run: swift test
      - name: Package native app
        run: scripts/build-app.sh debug
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent 'build/USS ACC.app' build/USS-ACC-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: USS-ACC-macOS
          path: build/USS-ACC-macOS.zip
